<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Avant-Garde Micro-Sequencer</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap');

    :root {
      --bg-color: #EBE9E1;
      --c-red: #D22B1F;
      --c-black: #1A1A1A;
      --c-blue: #2B4C7E;
      --c-yellow: #E6B522;
    }

    body {
      background-color: var(--bg-color);
      font-family: 'Space Mono', monospace;
      margin: 0;
      padding: 0;
      overflow: hidden;
      user-select: none;
      -webkit-touch-callout: none;
    }

    .seq-container {
      width: 100%;
      height: 600px;
      position: relative;
      display: flex;
      flex-direction: column;
      border: 4px solid var(--c-black);
      box-sizing: border-box;
      background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="noiseFilter"><feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23noiseFilter)" opacity="0.05"/></svg>');
    }

    /* Top Menu */
    .menu {
      border-bottom: 4px solid var(--c-black);
      display: flex;
      flex-wrap: wrap;
      background: var(--bg-color);
      z-index: 20;
    }

    .menu-btn {
      flex: 1 1 12%; /* Default desktop flex */
      min-width: 60px;
      padding: 10px 4px;
      text-align: center;
      font-weight: bold;
      text-transform: uppercase;
      font-size: 10px;
      letter-spacing: 0.5px;
      border-right: 2px solid var(--c-black);
      border-bottom: 2px solid var(--c-black);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      touch-action: manipulation;
    }
    
    .menu-btn.active {
      background: var(--c-black);
      color: var(--bg-color);
    }
    .menu-btn:hover:not(.active) {
      background: rgba(0,0,0,0.05);
    }

    /* Transport */
    #transport {
      background: var(--c-red);
      color: var(--bg-color);
      font-size: 14px;
    }
    #transport.playing {
      background: var(--c-black);
    }

    /* Settings Bars */
    .controls-bar {
      display: flex;
      flex-wrap: wrap;
      padding: 8px 12px;
      border-bottom: 2px solid var(--c-black);
      gap: 16px;
      font-size: 11px;
      font-weight: bold;
      align-items: center;
      text-transform: uppercase;
    }

    /* Canvas Area */
    #canvas {
      flex: 1;
      position: relative;
      overflow: hidden;
      cursor: crosshair;
      touch-action: none; /* Prevents scroll on swipe */
      background-size: calc(100% / 16) calc(100% / 12);
      background-position: -1px -1px;
    }
    #canvas.show-grid {
      background-image: 
        linear-gradient(to right, rgba(0, 0, 0, 0.08) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 0, 0, 0.08) 1px, transparent 1px);
    }

    /* Sweeping Playhead */
    #playhead {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 4px;
      background-color: var(--c-red);
      z-index: 10;
      pointer-events: none;
      mix-blend-mode: multiply;
    }

    /* Geometric Shapes */
    .shape {
      position: absolute;
      transform: translate(-50%, -50%);
      mix-blend-mode: multiply;
      pointer-events: none;
      transition: transform 0.05s ease-out, filter 0.05s;
    }

    .shape-sine { width: 40px; height: 40px; background: var(--c-red); border-radius: 50%; }
    .shape-noise { width: 0; height: 0; border-left: 25px solid transparent; border-right: 25px solid transparent; border-bottom: 45px solid var(--c-black); }
    .shape-pop { width: 60px; height: 30px; background: var(--c-blue); border-radius: 30px 30px 0 0; }
    .shape-sub { width: 100%; height: 8px; background: var(--c-black); left: 0 !important; transform: translateY(-50%); }
    .shape-fm { width: 35px; height: 35px; background: repeating-linear-gradient(45deg, var(--c-yellow), var(--c-yellow) 4px, var(--bg-color) 4px, var(--bg-color) 8px); border: 2px solid var(--c-black); }
    .shape-error { font-size: 40px; font-weight: bold; color: var(--c-black); line-height: 1; }
    .shape-drone { width: 80px; height: 80px; border: 6px solid var(--c-black); border-radius: 10px; background: repeating-linear-gradient(90deg, transparent, transparent 4px, rgba(0,0,0,0.1) 4px, rgba(0,0,0,0.1) 8px); }

    .glitch-trigger { transform: translate(-50%, -50%) scale(1.4) skewX(20deg) !important; filter: invert(100%); }
    .shape-sub.glitch-trigger { transform: translateY(-50%) scaleY(3) !important; }

    /* Overlay */
    #start-overlay { position: absolute; inset: 0; background: var(--bg-color); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
    .big-btn { font-family: 'Space Mono', monospace; font-size: 20px; font-weight: bold; background: var(--c-black); color: var(--bg-color); border: none; padding: 15px 30px; cursor: pointer; text-transform: uppercase; }
    .big-btn:hover { background: var(--c-red); }

    /* Mobile overrides */
    @media (max-width: 768px) {
      body { padding: 0 !important; }
      .seq-container { height: 100dvh; border: none; border-top: 2px solid var(--c-black); }
      .menu-btn { flex: 1 1 20%; font-size: 9px; padding: 8px 2px; }
      .controls-bar { gap: 10px; justify-content: space-between; }
      input[type=range] { width: 60px; }
    }
  </style>
</head>
<body class="p-0 md:p-4">

  <div class="seq-container">
    
    <div id="start-overlay">
      <button class="big-btn" id="start-btn">Initialize Art</button>
      <p class="mt-4 text-xs tracking-widest uppercase opacity-50">Tap canvas to compose</p>
    </div>

    <!-- Toolbar Menu -->
    <div class="menu">
      <div id="transport" class="menu-btn justify-center" style="flex-basis:100%; font-size: 14px;">▶ Start</div>
      <div id="grid-toggle" class="menu-btn justify-center" style="flex-basis:100%; background: #E5E5E5; font-size: 10px;">Grid: OFF</div>
      <div class="menu-btn active" data-type="sine">
        <div style="width:12px;height:12px;background:var(--c-red);border-radius:50%;"></div>
        Sine Ping
      </div>
      <div class="menu-btn" data-type="noise">
        <div style="width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:10px solid var(--c-black);"></div>
        Noise Cut
      </div>
      <div class="menu-btn" data-type="pop">
        <div style="width:14px;height:7px;background:var(--c-blue);border-radius:14px 14px 0 0;"></div>
        Vinyl Pop
      </div>
      <div class="menu-btn" data-type="fm">
        <div style="width:12px;height:12px;background:var(--c-yellow);border:1px solid black;"></div>
        FM Glitch
      </div>
      <div class="menu-btn" data-type="error">
        <span style="font-size:12px;font-weight:bold;line-height:1;">X</span>
        Data Error
      </div>
      <div class="menu-btn" data-type="drone">
        <div style="width:14px;height:14px;background:transparent;border:2px solid var(--c-black);border-radius:2px;"></div>
        Drone
      </div>
      <div class="menu-btn" data-type="sub">
        <div style="width:14px;height:3px;background:var(--c-black);"></div>
        Sub Line
      </div>
      <div class="menu-btn justify-center" id="clear-btn" style="background:#E5E5E5;">
        Clear All
      </div>
    </div>

    <!-- Settings Bar -->
    <div class="controls-bar" style="background: #D1CEC5;">
      <label style="display:flex; align-items:center; gap:4px;">
        BPM: <input type="range" id="bpm-slider" min="30" max="300" value="120" style="accent-color: var(--c-black);"> <span id="bpm-val" style="width:20px;">120</span>
      </label>
      <label style="display:flex; align-items:center; gap:4px;">
        Pitch: <input type="range" id="pitch-slider" min="-24" max="24" value="0" style="accent-color: var(--c-black);"> <span id="pitch-val" style="width:20px;">0</span>
      </label>
    </div>

    <!-- FX Bar -->
    <div class="controls-bar" style="background: var(--c-black); color: var(--bg-color);">
      <span class="hidden md:inline" id="fx-label">FX (SINE PING):</span>
      <label style="display:flex; align-items:center; gap:4px;">
        Rev <input type="range" id="fx-reverb" min="0" max="100" value="0" style="accent-color: var(--c-red);">
      </label>
      <label style="display:flex; align-items:center; gap:4px;">
        Del <input type="range" id="fx-delay" min="0" max="100" value="0" style="accent-color: var(--c-red);">
      </label>
      <label style="display:flex; align-items:center; gap:4px;">
        Trm <input type="range" id="fx-tremolo" min="0" max="100" value="0" style="accent-color: var(--c-red);">
      </label>
      <label style="display:flex; align-items:center; gap:4px;">
        Dst <input type="range" id="fx-dist" min="0" max="100" value="0" style="accent-color: var(--c-red);">
      </label>
    </div>

    <!-- Interactive Canvas -->
    <div id="canvas">
      <div id="playhead"></div>
    </div>

  </div>

  <script>
    let BPM = 120;
    let LOOP_TIME = (60 / BPM) * 4; // 4 beats per cycle
    let globalPitchShift = 0; // Semitones shift

    const COLS = 16;
    const ROWS = 12;

    // Settings listeners
    document.getElementById('bpm-slider').addEventListener('input', (e) => {
      const newBPM = parseInt(e.target.value);
      document.getElementById('bpm-val').textContent = newBPM;
      
      const newLoopTime = (60 / newBPM) * 4;
      
      if (isPlaying && audioCtx) {
        const currentTime = audioCtx.currentTime - startTime;
        const currentLoopPos = currentTime % LOOP_TIME;
        const currentLoopCount = Math.floor(currentTime / LOOP_TIME);
        
        const progress = currentLoopPos / LOOP_TIME;
        const newLoopPos = progress * newLoopTime;
        const newCurrentTime = (currentLoopCount * newLoopTime) + newLoopPos;
        
        startTime = audioCtx.currentTime - newCurrentTime;
      }
      
      BPM = newBPM;
      LOOP_TIME = newLoopTime;
    });

    document.getElementById('pitch-slider').addEventListener('input', (e) => {
      globalPitchShift = parseInt(e.target.value);
      document.getElementById('pitch-val').textContent = globalPitchShift > 0 ? '+' + globalPitchShift : globalPitchShift;
    });

    function getPitchRatio() {
      return Math.pow(2, globalPitchShift / 12);
    }
    
    let audioCtx;
    let distBus, tremoloBus, delayBus, reverbBus;
    let isPlaying = false;
    let showGrid = false;
    let events = []; // { id, type, xPercent, yPercent, el, scheduledLoopCount }
    let currentSoundType = 'sine';

    // Per-sound FX Settings
    const fxSettings = {
      sine: { reverb: 0, delay: 0, tremolo: 0, dist: 0 },
      noise: { reverb: 0, delay: 0, tremolo: 0, dist: 0 },
      pop: { reverb: 0, delay: 0, tremolo: 0, dist: 0 },
      fm: { reverb: 0, delay: 0, tremolo: 0, dist: 0 },
      error: { reverb: 0, delay: 0, tremolo: 0, dist: 0 },
      drone: { reverb: 0, delay: 0, tremolo: 0, dist: 0 },
      sub: { reverb: 0, delay: 0, tremolo: 0, dist: 0 }
    };
    
    // FX Listeners
    document.getElementById('fx-reverb').addEventListener('input', (e) => {
      fxSettings[currentSoundType].reverb = parseInt(e.target.value);
    });
    document.getElementById('fx-delay').addEventListener('input', (e) => {
      fxSettings[currentSoundType].delay = parseInt(e.target.value);
    });
    document.getElementById('fx-tremolo').addEventListener('input', (e) => {
      fxSettings[currentSoundType].tremolo = parseInt(e.target.value);
    });
    document.getElementById('fx-dist').addEventListener('input', (e) => {
      fxSettings[currentSoundType].dist = parseInt(e.target.value);
    });

    let loopCount = 0;
    let startTime = 0;
    let requestAnimId;

    const canvas = document.getElementById('canvas');
    const playhead = document.getElementById('playhead');
    const transport = document.getElementById('transport');

    // UI Selections
    document.querySelectorAll('.menu-btn[data-type]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.menu-btn[data-type]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentSoundType = btn.dataset.type;
        
        // Update FX sliders to match selected sound
        const typeFx = fxSettings[currentSoundType];
        document.getElementById('fx-reverb').value = typeFx.reverb;
        document.getElementById('fx-delay').value = typeFx.delay;
        document.getElementById('fx-tremolo').value = typeFx.tremolo;
        document.getElementById('fx-dist').value = typeFx.dist;
        document.getElementById('fx-label').innerText = `FX (${currentSoundType.toUpperCase()}):`;
      });
    });

    // Grid Toggle
    document.getElementById('grid-toggle').addEventListener('click', () => {
      showGrid = !showGrid;
      if (showGrid) {
        canvas.classList.add('show-grid');
        document.getElementById('grid-toggle').style.background = 'var(--c-yellow)';
        document.getElementById('grid-toggle').innerText = 'Grid: ON';
      } else {
        canvas.classList.remove('show-grid');
        document.getElementById('grid-toggle').style.background = '#E5E5E5';
        document.getElementById('grid-toggle').innerText = 'Grid: OFF';
      }
    });

    document.getElementById('clear-btn').addEventListener('click', () => {
      events.forEach(e => e.el.remove());
      events = [];
    });

    // Place Object on Canvas (with snap to grid)
    canvas.addEventListener('pointerdown', (e) => {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      
      // Snap logic conditional on Grid visibility
      let finalX = x;
      let finalY = y;
      
      if (showGrid) {
        const colWidth = rect.width / COLS;
        const rowHeight = rect.height / ROWS;
        finalX = Math.floor(x / colWidth) * colWidth + (colWidth / 2);
        finalY = Math.floor(y / rowHeight) * rowHeight + (rowHeight / 2);
      }
      
      const xPercent = finalX / rect.width;
      const yPercent = finalY / rect.height;

      createEvent(xPercent, yPercent, currentSoundType);
    });

    function createEvent(xPercent, yPercent, type) {
      const el = document.createElement('div');
      el.className = `shape shape-${type}`;
      
      if (type === 'error') {
        const letters = ['X', 'A', '0', '1', '!', '?'];
        el.textContent = letters[Math.floor(Math.random() * letters.length)];
      }

      // X mapping is time. Y mapping is pitch/parameter.
      el.style.left = `${xPercent * 100}%`;
      el.style.top = `${yPercent * 100}%`;
      
      canvas.appendChild(el);

      events.push({
        id: Date.now() + Math.random(),
        type,
        xPercent,
        yPercent,
        el,
        scheduledLoopCount: -1
      });
    }

    // --- Audio System ---
    
    document.getElementById('start-btn').addEventListener('click', () => {
      document.getElementById('start-overlay').style.display = 'none';
      initAudio();
    });

    transport.addEventListener('click', () => {
      if (!audioCtx) initAudio();
      
      if (isPlaying) {
        isPlaying = false;
        transport.textContent = '▶ Start';
        transport.classList.remove('playing');
        cancelAnimationFrame(requestAnimId);
      } else {
        if(audioCtx.state === 'suspended') audioCtx.resume();
        isPlaying = true;
        transport.textContent = '■ Stop';
        transport.classList.add('playing');
        startTime = audioCtx.currentTime;
        loopCount = 0;
        schedulerLoop();
      }
    });

    function initAudio() {
      if(audioCtx) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      
      // 1. Dist Bus (Parallel)
      distBus = audioCtx.createGain();
      const distShaper = audioCtx.createWaveShaper();
      distShaper.curve = makeDistortionCurve(100);
      const distFilter = audioCtx.createBiquadFilter();
      distFilter.type = 'lowpass';
      distFilter.frequency.value = 600;
      
      distBus.connect(distShaper);
      distShaper.connect(distFilter);
      distFilter.connect(audioCtx.destination);
      
      // 2. Tremolo Bus (Parallel volume modulation)
      tremoloBus = audioCtx.createGain();
      const tremLfo = audioCtx.createOscillator();
      tremLfo.frequency.value = 6;
      
      const tremMod = audioCtx.createGain();
      tremMod.gain.value = 0.5; // Base volume
      
      const lfoGain = audioCtx.createGain();
      lfoGain.gain.value = 0.5;
      tremLfo.connect(lfoGain);
      lfoGain.connect(tremMod.gain);
      tremLfo.start();
      
      tremoloBus.connect(tremMod);
      tremMod.connect(audioCtx.destination);

      // 3. Delay Bus
      delayBus = audioCtx.createGain();
      const delayNode = audioCtx.createDelay(2.0);
      delayNode.delayTime.value = 0.35;
      const delayFeedback = audioCtx.createGain();
      delayFeedback.gain.value = 0.5;
      
      delayBus.connect(delayNode);
      delayNode.connect(delayFeedback);
      delayFeedback.connect(delayNode);
      delayNode.connect(audioCtx.destination);
      
      // 4. Reverb Bus
      reverbBus = audioCtx.createGain();
      const reverbNode = audioCtx.createConvolver();
      reverbNode.buffer = createReverbIR(audioCtx);
      
      reverbBus.connect(reverbNode);
      reverbNode.connect(audioCtx.destination);
    }

    function makeDistortionCurve(amount) {
      const k = typeof amount === 'number' ? amount : 50;
      const n_samples = 44100;
      const curve = new Float32Array(n_samples);
      const deg = Math.PI / 180;
      for (let i = 0; i < n_samples; ++i) {
        const x = i * 2 / n_samples - 1;
        curve[i] = (3 + k) * x * 20 * deg / (Math.PI + k * Math.abs(x));
      }
      return curve;
    }

    function createReverbIR(ctx) {
      const length = ctx.sampleRate * 2.5; 
      const impulse = ctx.createBuffer(2, length, ctx.sampleRate);
      for (let c = 0; c < 2; c++) {
        const channelData = impulse.getChannelData(c);
        for (let i = 0; i < length; i++) {
          channelData[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ctx.sampleRate * 0.4));
        }
      }
      return impulse;
    }

    // Main scheduling and animation loop
    function schedulerLoop() {
      if(!isPlaying) return;
      
      const currentTime = audioCtx.currentTime - startTime;
      const currentLoopPos = currentTime % LOOP_TIME;
      const currentLoopCount = Math.floor(currentTime / LOOP_TIME);

      // Update Playhead Visual
      const progress = currentLoopPos / LOOP_TIME;
      playhead.style.left = `${progress * 100}%`;

      // Schedule Audio Lookahead
      // We look ahead by 0.1 seconds
      const lookaheadTime = 0.1;
      
      events.forEach(ev => {
        const eventTimeInLoop = ev.xPercent * LOOP_TIME;
        
        // Is the event coming up in the next lookahead window?
        // Case 1: normal within this loop
        if (eventTimeInLoop >= currentLoopPos && eventTimeInLoop < currentLoopPos + lookaheadTime) {
          if (ev.scheduledLoopCount < currentLoopCount) {
            scheduleSound(ev, startTime + (currentLoopCount * LOOP_TIME) + eventTimeInLoop);
            ev.scheduledLoopCount = currentLoopCount;
          }
        }
        // Case 2: event is at the beginning of the NEXT loop, and we are at the very end of CURRENT loop
        else if (currentLoopPos + lookaheadTime >= LOOP_TIME) {
          const overlap = (currentLoopPos + lookaheadTime) - LOOP_TIME;
          if (eventTimeInLoop < overlap) {
            if (ev.scheduledLoopCount < currentLoopCount + 1) {
              scheduleSound(ev, startTime + ((currentLoopCount + 1) * LOOP_TIME) + eventTimeInLoop);
              ev.scheduledLoopCount = currentLoopCount + 1;
            }
          }
        }

        // Trigger visual glitch exactly when playhead crosses
        if (Math.abs(progress - ev.xPercent) < 0.015) {
          ev.el.classList.add('glitch-trigger');
        } else {
          ev.el.classList.remove('glitch-trigger');
        }
      });

      requestAnimId = requestAnimationFrame(schedulerLoop);
    }

    // --- Extreme Micro-Sound Generators ---

    function scheduleSound(ev, time) {
      const { type, yPercent } = ev;
      const invY = 1.0 - yPercent;
      const pitchRatio = getPitchRatio();
      const typeFx = fxSettings[type];
      
      const eventOutput = audioCtx.createGain();

      if (type === 'sine') {
        // High-pitched 5ms sine burst
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = (1000 + (invY * 4000)) * pitchRatio; // 1k to 5k
        osc.connect(gain);
        gain.connect(eventOutput);
        
        gain.gain.setValueAtTime(0, time);
        gain.gain.linearRampToValueAtTime(0.8, time + 0.001);
        gain.gain.exponentialRampToValueAtTime(0.001, time + 0.015);
        
        osc.start(time);
        osc.stop(time + 0.02);
      }
      
      else if (type === 'noise') {
        // Clicks and Cuts white noise slice
        const bufferSize = audioCtx.sampleRate * 0.05; // 50ms buffer
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.value = (500 + (invY * 8000)) * pitchRatio;
        filter.Q.value = 10; // Sharp click
        
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(1, time);
        gain.gain.exponentialRampToValueAtTime(0.01, time + 0.02);
        
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(eventOutput);
        noise.start(time);
      }
      
      else if (type === 'pop') {
        // Vinyl pop / static crackle
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        
        // Rapidly drop frequency to create a click/thump
        osc.frequency.setValueAtTime(8000 * pitchRatio, time);
        osc.frequency.exponentialRampToValueAtTime(10 * pitchRatio, time + 0.005);
        
        gain.gain.setValueAtTime(0.5, time);
        gain.gain.exponentialRampToValueAtTime(0.001, time + 0.005);
        
        osc.connect(gain);
        gain.connect(eventOutput);
        osc.start(time);
        osc.stop(time + 0.01);
      }
      
      else if (type === 'fm') {
        // FM metallic glitch
        const carrier = audioCtx.createOscillator();
        const mod = audioCtx.createOscillator();
        const modGain = audioCtx.createGain();
        const outGain = audioCtx.createGain();
        
        carrier.type = 'sine';
        mod.type = 'sawtooth';
        
        const baseFreq = (200 + (invY * 800)) * pitchRatio;
        carrier.frequency.setValueAtTime(baseFreq, time);
        mod.frequency.setValueAtTime(baseFreq * 3.14, time); // Inharmonic ratio
        
        modGain.gain.setValueAtTime(1000 * pitchRatio, time);
        modGain.gain.exponentialRampToValueAtTime(10 * pitchRatio, time + 0.05);
        
        mod.connect(modGain);
        modGain.connect(carrier.frequency);
        
        carrier.connect(outGain);
        outGain.connect(eventOutput);
        
        outGain.gain.setValueAtTime(0, time);
        outGain.gain.linearRampToValueAtTime(0.6, time + 0.005);
        outGain.gain.exponentialRampToValueAtTime(0.001, time + 0.05);
        
        carrier.start(time);
        mod.start(time);
        carrier.stop(time + 0.06);
        mod.stop(time + 0.06);
      }
      
      else if (type === 'error') {
        // Digital bit-crush representation using harsh distortion
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const shaper = audioCtx.createWaveShaper();
        
        osc.type = 'sawtooth';
        osc.frequency.value = (50 + (invY * 200)) * pitchRatio;
        
        // Extreme hard clipping
        const curve = new Float32Array(44100);
        for(let i=0; i<44100; i++) {
          const x = i * 2 / 44100 - 1;
          curve[i] = x < 0 ? -1 : 1; 
        }
        shaper.curve = curve;
        
        osc.connect(shaper);
        shaper.connect(gain);
        gain.connect(eventOutput);
        
        gain.gain.setValueAtTime(0.2, time);
        gain.gain.setValueAtTime(0, time + 0.02); // 20ms burst
        
        osc.start(time);
        osc.stop(time + 0.03);
      }
      
      else if (type === 'sub') {
        // Deep continuous line, played as a short 808 kick/thump when passed
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        
        const freq = (30 + (invY * 60)) * pitchRatio; // 30Hz to 90Hz
        osc.frequency.setValueAtTime(freq, time);
        
        osc.connect(gain);
        gain.connect(eventOutput);
        
        gain.gain.setValueAtTime(0.8, time);
        gain.gain.exponentialRampToValueAtTime(0.01, time + 0.3);
        
        osc.start(time);
        osc.stop(time + 0.4);
      }
      
      else if (type === 'drone') {
        const osc1 = audioCtx.createOscillator();
        const osc2 = audioCtx.createOscillator();
        const filter = audioCtx.createBiquadFilter();
        const gain = audioCtx.createGain();
        
        osc1.type = 'sawtooth';
        osc2.type = 'square';
        
        const freq = (25 + (invY * 50)) * pitchRatio;
        osc1.frequency.value = freq;
        osc2.frequency.value = freq * 1.01;
        
        filter.type = 'lowpass';
        // Much darker filter to remove harshness
        filter.frequency.setValueAtTime(100 + (invY*200), time);
        filter.frequency.linearRampToValueAtTime(200 + (invY*300), time + (LOOP_TIME / 2));
        filter.frequency.linearRampToValueAtTime(100 + (invY*200), time + LOOP_TIME);
        
        osc1.connect(filter);
        osc2.connect(filter);
        filter.connect(gain);
        gain.connect(eventOutput);
        
        // Lower volume and very long crossfade to eliminate any "attack" pulse
        const maxVol = 0.15;
        gain.gain.setValueAtTime(0, time);
        gain.gain.linearRampToValueAtTime(maxVol, time + 0.5); // Very slow fade in
        gain.gain.setValueAtTime(maxVol, time + LOOP_TIME - 0.5);
        gain.gain.linearRampToValueAtTime(0, time + LOOP_TIME + 0.5); // Very slow fade out
        
        osc1.start(time);
        osc2.start(time);
        osc1.stop(time + LOOP_TIME + 0.6);
        osc2.stop(time + LOOP_TIME + 0.6);
      }

      // Route eventOutput to FX buses
      const distVal = typeFx.dist / 100;
      const tremVal = typeFx.tremolo / 100;
      const delVal = typeFx.delay / 100;
      const revVal = typeFx.reverb / 100;

      const dryGain = audioCtx.createGain();
      dryGain.gain.value = (1.0 - distVal) * (1.0 - (tremVal / 2));
      eventOutput.connect(dryGain);
      dryGain.connect(audioCtx.destination);

      if (distVal > 0) {
        const send = audioCtx.createGain();
        send.gain.value = distVal;
        eventOutput.connect(send);
        send.connect(distBus);
      }
      if (tremVal > 0) {
        const send = audioCtx.createGain();
        send.gain.value = tremVal;
        eventOutput.connect(send);
        send.connect(tremoloBus);
      }
      if (delVal > 0) {
        const send = audioCtx.createGain();
        send.gain.value = delVal;
        eventOutput.connect(send);
        send.connect(delayBus);
      }
      if (revVal > 0) {
        const send = audioCtx.createGain();
        send.gain.value = revVal;
        eventOutput.connect(send);
        send.connect(reverbBus);
      }
    }

    // Initialize with a few aesthetic default shapes
    createEvent(0.1, 0.4, 'noise');
    createEvent(0.2, 0.2, 'sine');
    createEvent(0.3, 0.8, 'error');
    createEvent(0.45, 0.5, 'pop');
    createEvent(0.6, 0.3, 'fm');
    createEvent(0.8, 0.6, 'noise');
    createEvent(0.9, 0.1, 'error');

  </script>
</body>
